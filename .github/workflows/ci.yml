name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Three parallel jobs: wall time is the slowest job rather than the sum of all steps.
jobs:
  checks:
    name: Lint, unit, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run typecheck

  production:
    name: Build, release smoke, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  preview:
    name: Preview browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview
        env:
          PORTFOLIO_PREVIEW_BUILD: "1"
